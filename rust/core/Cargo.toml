[package]
name = "moth-mobile-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared native game engine for experimental Android Moth Controller"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
