name: Android GeckoView debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Attempt ARM64 native Rust core
        id: native
        continue-on-error: true # GeckoView-only APK must remain obtainable during JNI bring-up
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android26-clang
          export CC_aarch64_linux_android=aarch64-linux-android26-clang
          export AR_aarch64_linux_android=llvm-ar
          cargo build --manifest-path rust/core/Cargo.toml --release --target aarch64-linux-android
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp rust/core/target/aarch64-linux-android/release/libmoth_mobile_core.so app/src/main/jniLibs/arm64-v8a/
      - name: Build GeckoView APK and JVM tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: APK contents
        run: |
          if [ -f app/src/main/jniLibs/arm64-v8a/libmoth_mobile_core.so ]; then
            echo "Rust JNI library packaged" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GeckoView-only APK: Rust JNI cross-build unavailable (review native step)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: moth-mobile-geckoview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
